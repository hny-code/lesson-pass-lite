<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lesson Pass Lite</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow-x:hidden}
body{min-height:100%;background:#f5f5f3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:#1a1a1a;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px}
@media(min-width:768px){body{padding-bottom:110px}}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:2rem 1rem 1rem}
.logo-block{text-align:center;margin-bottom:2rem}
.logo-main{font-size:17px;font-weight:500;letter-spacing:0.06em}
.logo-divider{width:28px;height:1px;background:#bbb;margin:8px auto}
.logo-sub{font-size:10px;letter-spacing:0.18em;color:#888;text-transform:uppercase}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.card.deleted{background:#fafafa;border-color:#e8e8e8;opacity:0.75}
.btn{display:inline-flex;align-items:center;padding:8px 20px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;transition:background 0.12s}
.btn:hover{background:#f0f0ee}
.btn-primary{background:#1D9E75;color:#fff;border-color:#1D9E75}
.btn-primary:hover{background:#0F6E56}
.btn-danger{background:#E24B4A;color:#fff;border-color:#E24B4A}
.btn-danger:hover{background:#A32D2D}
.btn-sm{padding:5px 13px;font-size:13px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-block{display:block;width:100%;padding:13px;border-radius:10px;border:0.5px solid #1D9E75;background:#fff;color:#1D9E75;font-size:15px;font-weight:500;cursor:pointer;text-align:center;margin-bottom:10px;transition:background 0.12s}
.btn-block:hover{background:#E1F5EE}
.btn-block.primary{background:#1D9E75;color:#fff}
.btn-block.primary:hover{background:#0F6E56}
.pw-wrap{position:relative;margin-bottom:14px}
.pw-wrap input{margin-bottom:0;padding-right:42px}
.pw-toggle{position:absolute;right:10px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;padding:4px;color:#aaa;line-height:1}
.pw-toggle:hover{color:#555}
.tab-bar{display:flex;gap:4px;margin-bottom:1.25rem}
.tab{flex:1;padding:7px 0;border-radius:8px;border:0.5px solid #ddd;font-size:13px;cursor:pointer;background:transparent;color:#666;text-align:center}
.tab.active{background:#1D9E75;color:#fff;border-color:#1D9E75}
label{display:block;font-size:13px;color:#666;margin-bottom:4px}
input[type=text],input[type=password],input[type=email],input[type=date],select{width:100%;padding:9px 11px;border:0.5px solid #ccc;border-radius:8px;font-size:16px;background:#fff;color:#1a1a1a;margin-bottom:14px;-webkit-appearance:none;appearance:none;outline:none}
input:focus,select:focus{border-color:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,0.12)}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
.badge-active{background:#E1F5EE;color:#0F6E56}
.badge-expired{background:#FCEBEB;color:#A32D2D}
.badge-used{background:#f0f0ee;color:#666}
.badge-deleted{background:#f0f0ee;color:#999}
.dot-row{display:flex;gap:7px;margin:12px 0;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;background:#f5f5f3;color:#aaa}
.dot.used{background:#1D9E75;border-color:#1D9E75;color:#fff}
.dot.remaining{background:#fff;border-color:#1D9E75;color:#1D9E75}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem}
.member-block{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:0.875rem 1.25rem;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.member-icon{width:42px;height:42px;border-radius:50%;background:#E1F5EE;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#0F6E56;flex-shrink:0}
.member-name{font-size:16px;font-weight:500;line-height:1.3}
.member-no{font-size:12px;color:#888;margin-top:2px}
.sub{font-size:13px;color:#888}
.mt8{margin-top:8px}
.err{color:#A32D2D;font-size:13px;margin-top:2px;min-height:18px}
.loading{text-align:center;padding:2rem;color:#888;font-size:14px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #ddd;border-top-color:#1D9E75;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle}
.deleted-info{font-size:12px;color:#bbb;margin-top:6px;padding-top:6px;border-top:0.5px solid #f0f0ee}
.show-deleted-row{text-align:center;margin-bottom:12px}
.show-deleted-btn{font-size:12px;color:#aaa;background:none;border:none;cursor:pointer;text-decoration:underline}
.member-hint{font-size:12px;color:#1D9E75;margin:-8px 0 10px;min-height:18px}
.link-btn{font-size:13px;color:#1D9E75;background:none;border:none;cursor:pointer;text-decoration:underline;display:block;margin-top:10px}
/* 広告 */
.ad-bar{position:fixed;bottom:0;left:0;right:0;width:100%;height:60px;background:#f5f5f3;border-top:0.5px solid #e0e0e0;overflow:hidden;z-index:999;display:flex;align-items:center;justify-content:center}
@media(min-width:768px){.ad-bar{height:100px}}
.ad-bar-inner{width:100%;height:100%}
@media(min-width:768px){.ad-bar-inner{width:728px;height:91px}}
.ad-bar-inner img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;cursor:pointer}
.ad-dots{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:1000;pointer-events:none}
@media(min-width:768px){.ad-dots{bottom:8px}}
.ad-dot{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,0.2)}
.ad-dot.active{background:#1D9E75}
/* 運営者テーブル */
.op-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px}
.op-table th{background:#f5f5f3;padding:8px 10px;text-align:left;border-bottom:1px solid #e0e0e0;font-weight:500;color:#666}
.op-table td{padding:8px 10px;border-bottom:0.5px solid #f0f0ee;vertical-align:top}
.section-title{font-size:13px;font-weight:600;color:#666;letter-spacing:0.08em;text-transform:uppercase;margin:1.5rem 0 0.75rem}
/* 目玉アイコン SVG */
.pw-toggle svg{width:18px;height:18px;display:block}
/* カスタムモーダル */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:2000;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:1.5rem 1.25rem;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
.modal-title{font-size:15px;font-weight:600;margin-bottom:12px;color:#1a1a1a}
.modal-body{font-size:14px;color:#444;line-height:1.7;margin-bottom:14px}
.modal-copy-area{background:#f5f5f3;border:0.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;font-size:13px;color:#1a1a1a;line-height:1.8;margin-bottom:14px;user-select:all;cursor:text;word-break:break-all}
.modal-copy-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:#1D9E75;background:none;border:0.5px solid #1D9E75;border-radius:8px;padding:6px 14px;cursor:pointer;margin-bottom:14px}
.modal-copy-btn:hover{background:#E1F5EE}
.modal-footer{text-align:right}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

<!-- カスタムモーダル -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <textarea class="modal-copy-area" id="modal-copy-area" style="display:none;resize:none;width:100%;border:0.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.8;background:#f5f5f3;color:#1a1a1a;font-family:inherit" rows="5" readonly></textarea>
    <button class="modal-copy-btn" id="modal-copy-btn" style="display:none" onclick="copyModalText()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      コピーする
    </button>
    <div class="modal-footer">
      <button class="btn btn-primary btn-sm" onclick="closeModal()">OK</button>
    </div>
  </div>
</div>

<!-- ========== トップ（役割選択） ========== -->
<div id="s-top" class="screen active">
  <div class="logo-block">
    <div class="logo-main">Lesson Pass Lite</div>
    <div class="logo-divider"></div>
    <div class="logo-sub">回数券管理</div>
  </div>
  <div class="card">
    <button class="btn-block primary" onclick="showScreen('s-admin-login')">管理者ログイン</button>
    <button class="btn-block" onclick="showScreen('s-user-login')">利用者ログイン</button>
  </div>
  <div style="text-align:center;margin-top:8px">
    <button class="link-btn" onclick="showScreen('s-admin-register')">管理者アカウントを新規作成</button>
  </div>
</div>

<!-- ========== 管理者 新規登録 ========== -->
<div id="s-admin-register" class="screen">
  <div class="top-bar">
    <div>
      <div style="font-size:15px;font-weight:500">Lesson Pass Lite</div>
      <div style="font-size:10px;letter-spacing:0.15em;color:#888;text-transform:uppercase;margin-top:2px">管理者登録</div>
    </div>
    <button class="btn btn-sm" onclick="showScreen('s-top')">戻る</button>
  </div>
  <div class="card">
    <label>施設名</label>
    <input type="text" id="reg-facility" placeholder="例：HIRO BJJ SENDAGI">
    <label>施設コード <span style="font-size:11px;color:#aaa">（半角英数字・利用者ログインに使用）</span></label>
    <input type="text" id="reg-facility-code" placeholder="例：sendagi" autocomplete="off">
    <label>ユーザー名 <span style="font-size:11px;color:#aaa">（半角英数字・ログインIDになります）</span></label>
    <input type="text" id="reg-username" placeholder="例：yamada_bjj" autocomplete="off">
    <label>氏名</label>
    <input type="text" id="reg-name" placeholder="例：山田 太郎">
    <label>メールアドレス</label>
    <input type="email" id="reg-email" placeholder="例：info@example.com">
    <label>パスワード</label>
    <div class="pw-wrap"><input type="password" id="reg-pw1" placeholder="6文字以上"><button type="button" class="pw-toggle" onclick="togglePw('reg-pw1',this)"><svg viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <label>パスワード（確認）</label>
    <div class="pw-wrap"><input type="password" id="reg-pw2"><button type="button" class="pw-toggle" onclick="togglePw('reg-pw2',this)"><svg viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div style="text-align:right"><button class="btn btn-primary" onclick="registerAdmin()">登録する</button></div>
    <div id="reg-err" class="err"></div>
  </div>
</div>

<!-- ========== 管理者 ログイン ========== -->
<div id="s-admin-login" class="screen">
  <div class="top-bar">
    <div>
      <div style="font-size:15px;font-weight:500">Lesson Pass Lite</div>
      <div style="font-size:10px;letter-spacing:0.15em;color:#888;text-transform:uppercase;margin-top:2px">管理者ログイン</div>
    </div>
    <button class="btn btn-sm" onclick="showScreen('s-top')">戻る</button>
  </div>
  <div class="card">
    <label>ユーザー名 またはメールアドレス</label>
    <input type="text" id="admin-login-id" placeholder="ユーザー名 または メールアドレス" autocomplete="off">
    <label>パスワード</label>
    <div class="pw-wrap"><input type="password" id="admin-login-pw"><button type="button" class="pw-toggle" onclick="togglePw('admin-login-pw',this)"><svg viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div style="text-align:right"><button class="btn btn-primary" onclick="loginAdmin()">ログイン</button></div>
    <div id="admin-login-err" class="err"></div>
    <button class="link-btn" onclick="showScreen('s-admin-reset')">パスワードをお忘れの方</button>
  </div>
</div>

<!-- ========== 管理者 パスワードリセット ========== -->
<div id="s-admin-reset" class="screen">
  <div class="top-bar">
    <div>
      <div style="font-size:15px;font-weight:500">Lesson Pass Lite</div>
      <div style="font-size:10px;letter-spacing:0.15em;color:#888;text-transform:uppercase;margin-top:2px">パスワードリセット</div>
    </div>
    <button class="btn btn-sm" onclick="showScreen('s-admin-login')">戻る</button>
  </div>
  <div class="card">
    <p class="sub" style="margin-bottom:14px">登録したメールアドレスにリセット用のリンクを送信します。</p>
    <label>メールアドレス</label>
    <input type="email" id="reset-email" placeholder="例：info@example.com">
    <div style="text-align:right"><button class="btn btn-primary" onclick="sendResetEmail()">送信する</button></div>
    <div id="reset-msg" style="font-size:13px;margin-top:6px;min-height:18px"></div>
  </div>

<!-- ========== 管理者 画面 ========== -->
<div id="s-admin" class="screen">
  <div class="top-bar">
    <div>
      <div style="font-size:15px;font-weight:500;letter-spacing:0.05em" id="admin-facility-name">Lesson Pass Lite</div>
      <div id="admin-label" style="font-size:10px;letter-spacing:0.15em;color:#888;text-transform:uppercase;margin-top:2px">管理画面</div>
    </div>
    <button class="btn btn-sm" onclick="logoutAdmin()">ログアウト</button>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="tab-list" onclick="adminTab('list')">券一覧</button>
    <button class="tab" id="tab-new" onclick="adminTab('new')">新規発行</button>
  </div>
  <div id="admin-list"></div>
  <div id="admin-new" style="display:none">
    <div class="card">
      <label>会員番号</label>
      <div class="member-hint" id="member-hint">取得中...</div>
      <div id="member-no-display" style="font-size:20px;font-weight:600;color:#1D9E75;margin-bottom:14px;letter-spacing:0.1em">----</div>
      <label>お名前</label>
      <input type="text" id="new-name" placeholder="例：山田 太郎">
      <label>回数</label>
      <select id="new-count"></select>
      <label>利用期限</label>
      <input type="date" id="new-expiry">
      <div style="text-align:right"><button class="btn btn-primary" onclick="issueTicket()">発行する</button></div>
      <div id="new-err" class="err"></div>
    </div>
  </div>
</div>

<!-- ========== 利用者 ログイン ========== -->
<div id="s-user-login" class="screen">
  <div class="top-bar">
    <div>
      <div style="font-size:15px;font-weight:500">Lesson Pass Lite</div>
      <div style="font-size:10px;letter-spacing:0.15em;color:#888;text-transform:uppercase;margin-top:2px">利用者ログイン</div>
    </div>
    <button class="btn btn-sm" onclick="showScreen('s-top')">戻る</button>
  </div>
  <div class="card">
    <label>施設コード</label>
    <input type="text" id="login-facility-code" placeholder="例：sendagi" autocomplete="off">
    <label>お名前</label>
    <input type="text" id="login-name" placeholder="例：山田 太郎">
    <label>会員番号</label>
    <input type="text" id="login-id" placeholder="例：0001" inputmode="numeric">
    <div style="text-align:right"><button class="btn btn-primary" onclick="loginUser()">確認する</button></div>
    <div id="login-err" class="err"></div>
  </div>
</div>

<!-- ========== 利用者 画面 ========== -->
<div id="s-user" class="screen">
  <div class="top-bar">
    <div>
      <div style="font-size:15px;font-weight:500;letter-spacing:0.05em" id="user-facility-name">Lesson Pass Lite</div>
      <div style="font-size:10px;letter-spacing:0.15em;color:#888;text-transform:uppercase;margin-top:2px">回数券</div>
    </div>
    <button class="btn btn-sm" onclick="showScreen('s-top')">戻る</button>
  </div>
  <div id="user-member-block"></div>
  <div id="user-cards"></div>
</div>

<!-- ========== 運営者 ログイン ========== -->
<div id="s-op-login" class="screen">
  <div class="top-bar">
    <div>
      <div style="font-size:15px;font-weight:500">Lesson Pass Lite</div>
      <div style="font-size:10px;letter-spacing:0.15em;color:#888;text-transform:uppercase;margin-top:2px">運営者ログイン</div>
    </div>
    <button class="btn btn-sm" onclick="showScreen('s-top')">戻る</button>
  </div>
  <div class="card">
    <label>パスワード</label>
    <div class="pw-wrap"><input type="password" id="op-pw"><button type="button" class="pw-toggle" onclick="togglePw('op-pw',this)"><svg viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div style="text-align:right"><button class="btn btn-primary" onclick="loginOperator()">ログイン</button></div>
    <div id="op-err" class="err"></div>
  </div>
</div>

<!-- ========== 運営者 画面 ========== -->
<div id="s-op" class="screen">
  <div class="top-bar">
    <div>
      <div style="font-size:15px;font-weight:500">Lesson Pass Lite</div>
      <div style="font-size:10px;letter-spacing:0.15em;color:#888;text-transform:uppercase;margin-top:2px">運営者画面</div>
    </div>
    <button class="btn btn-sm" onclick="logoutOperator()">ログアウト</button>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="op-tab-admins" onclick="opTab('admins')">管理者一覧</button>
    <button class="tab" id="op-tab-users" onclick="opTab('users')">利用者一覧</button>
    <button class="tab" id="op-tab-ads" onclick="opTab('ads')">広告管理</button>
  </div>
  <div id="op-admins"></div>
  <div id="op-users" style="display:none"></div>
  <div id="op-ads" style="display:none">
    <div class="card">
      <p class="sub" style="margin-bottom:14px">広告は最大4件まで設定できます。画像URLとリンクURLを入力してください。</p>
      <div id="op-ads-form"></div>
      <div style="text-align:right;margin-top:4px">
        <button class="btn btn-primary" onclick="saveAds()">保存する</button>
      </div>
      <div id="op-ads-msg" style="font-size:13px;margin-top:6px;min-height:18px"></div>
    </div>
  </div>
</div>

</div><!-- /wrap -->

<!-- 広告バナー -->
<div class="ad-bar">
  <div class="ad-bar-inner">
    <img id="ad-img" src="" alt="広告">
  </div>
</div>
<div class="ad-dots" id="ad-dots"></div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// ===== Firebase 初期化 =====
const firebaseConfig = {
  apiKey: "AIzaSyA6Y4tAJjoRbBENiCG2tte8ZkDDEd0WoWE",
  authDomain: "lesson-pass-lite.firebaseapp.com",
  projectId: "lesson-pass-lite",
  storageBucket: "lesson-pass-lite.firebasestorage.app",
  messagingSenderId: "563056484032",
  appId: "1:563056484032:web:162bb33a1ae2f95c4dd725",
  measurementId: "G-XW5X9QKHVT"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();
try{ firebase.analytics(); }catch(e){ console.warn('analytics error', e); }

const COL_TICKETS = 'tickets';
const COL_ADMINS  = 'admins';
const COL_CONFIG  = 'config';
const OP_SESSION  = 'lp_op_session';
const OP_PW       = 'lessonpass2026'; // 運営者パスワード（固定）

let currentAdminUid = null;
let showDeleted = false;

// ===== 広告 =====
let ADS = [];
let adIndex = 0;

async function loadAds(){
  try{
    const doc = await db.collection(COL_CONFIG).doc('ads').get();

// ===== 管理者 新規登録 =====
async function registerAdmin(){
  const facility     = document.getElementById('reg-facility').value.trim();
  const facilityCode = document.getElementById('reg-facility-code').value.trim().toLowerCase();
  const username     = document.getElementById('reg-username').value.trim();
  const name         = document.getElementById('reg-name').value.trim();
  const email        = document.getElementById('reg-email').value.trim();
  const pw1          = document.getElementById('reg-pw1').value;
  const pw2          = document.getElementById('reg-pw2').value;
  const errEl        = document.getElementById('reg-err');
  errEl.textContent  = '';

  if(!facility||!facilityCode||!username||!name||!email||!pw1||!pw2){ errEl.textContent='すべての項目を入力してください'; return; }
  if(!/^[a-zA-Z0-9_]+$/.test(facilityCode)){ errEl.textContent='施設コードは半角英数字・アンダースコアのみ使用できます'; return; }
  if(!/^[a-zA-Z0-9_]+$/.test(username)){ errEl.textContent='ユーザー名は半角英数字・アンダースコアのみ使用できます'; return; }
  if(pw1!==pw2){ errEl.textContent='パスワードが一致しません'; return; }
  if(pw1.length<6){ errEl.textContent='パスワードは6文字以上で設定してください'; return; }

  // 施設コード重複チェック
  const fcSnap = await db.collection(COL_ADMINS).where('facilityCode','==',facilityCode).get();
  if(!fcSnap.empty){ errEl.textContent='この施設コードはすでに使用されています'; return; }

  // ユーザー名重複チェック
  const snap = await db.collection(COL_ADMINS).where('username','==',username).get();
  if(!snap.empty){ errEl.textContent='このユーザー名はすでに使用されています'; return; }

  errEl.textContent = '登録中...';
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pw1);
    await db.collection(COL_ADMINS).doc(cred.user.uid).set({
      facility, facilityCode, username, name, email,
      createdAt: toJSTString(new Date())
    });
    alert(`登録が完了しました。\nユーザー名：${username}\n施設コード：${facilityCode}\nログイン画面に移動します。`);
    ['reg-facility','reg-facility-code','reg-username','reg-name','reg-email','reg-pw1','reg-pw2'].forEach(id=>document.getElementById(id).value='');
    errEl.textContent = '';
    showScreen('s-admin-login');
  }catch(e){
    if(e.code==='auth/email-already-in-use') errEl.textContent='このメールアドレスはすでに登録されています';
    else errEl.textContent = 'エラーが発生しました：'+e.message;
  }
}

async function initNewForm(){

  const sel = document.getElementById('new-count');
  if(sel.options.length===0){
    for(let i=1;i<=100;i++){

      opt.value = i;
      opt.textContent = i+'回';

  // 利用期限デフォルト（今日から1年後）

// ===== 回数券発行 =====
async function issueTicket(){
  const name   = document.getElementById('new-name').value.trim();
  const total  = parseInt(document.getElementById('new-count').value);
  const expiry = document.getElementById('new-expiry').value;
  const errEl  = document.getElementById('new-err');
  if(!name){ errEl.textContent='お名前を入力してください'; return; }
  if(!expiry){ errEl.textContent='利用期限を選択してください'; return; }
  if(!currentAdminUid){ errEl.textContent='ログインセッションが切れました。再ログインしてください'; return; }

  errEl.textContent = '発行中...';
  try{
    const member = document.getElementById('member-no-display').textContent;
    const now = new Date();
    await db.collection(COL_TICKETS).add({
      adminId: currentAdminUid,
      member, name, total, used: 0,
      issued:  toJSTString(now),
      expiry:  expiry+' 23:59',
      deleted: '', deletedAt: ''
    });
    document.getElementById('new-name').value  = '';
    document.getElementById('new-expiry').value = '';
    errEl.textContent = '';

    const url          = location.href;
    const adminDoc     = await db.collection(COL_ADMINS).doc(currentAdminUid).get();
    const facilityCode = adminDoc.exists ? (adminDoc.data().facilityCode || '') : '';
    const copyText     = `URL：${url}\n施設コード：${facilityCode}\nお名前：${name}\n会員番号：${member}`;
    showModal('発行が完了しました', '利用者に以下をお知らせください：', copyText, ()=>adminTab('list'));
  }catch(e){
    errEl.textContent = '通信エラーが発生しました。';
  }
}

// ===== 管理者一覧レンダリング =====
async function renderAdminList(){
  const el = document.getElementById('admin-list');
  el.innerHTML = loadingHTML();
  if(!currentAdminUid){ el.innerHTML=''; return; }
  try{
    const all = await getTicketsByAdmin(currentAdminUid);
    const active  = all.filter(t=>!isDeleted(t));
    const deleted = all.filter(t=>isDeleted(t));
    if(!all.length){ el.innerHTML='<p class="sub">発行済みの回数券がありません</p>'; return; }
    const visible = showDeleted ? all : active;
    let html = visible.map(t=>{
      const st     = statusOf(t);
      const remain = Number(t.total)-Number(t.used);
      const canUse = st==='active' && remain>0;
      const isDel  = isDeleted(t);
      return `<div class="card${isDel?' deleted':''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div><span style="font-weight:500">${t.name}</span><span class="sub" style="margin-left:8px">No.${padMember(t.member)}</span></div>
          ${badgeHTML(st)}
        </div>
        <div class="sub">${t.total}回券　残り <strong style="color:#1a1a1a">${remain}</strong> 回　/ 期限：${dateOnly(t.expiry)}</div>
        ${renderDots(t.total,t.used,st)}
        ${isDel
          ?`<div class="deleted-info">削除日時：${dateTime(t.deletedAt)}</div>`
          :`<div class="btn-row">
              ${canUse?`<button class="btn btn-primary btn-sm" onclick="useOne('${t.docId}',${Number(t.used)},${Number(t.total)})">1回 使用済みにする</button>`:''}
              ${Number(t.used)>0?`<button class="btn btn-sm" onclick="undoOne('${t.docId}',${Number(t.used)})">1回 戻す</button>`:''}
              <button class="btn btn-danger btn-sm" onclick="deleteTicket('${t.docId}')">削除</button>
            </div>`
        }
      </div>`;
    }).join('');
    if(deleted.length>0){
      html += `<div class="show-deleted-row">
        <button class="show-deleted-btn" onclick="toggleDeleted()">
          ${showDeleted?'削除済みを隠す':`削除済みを表示する（${deleted.length}件）`}
        </button>
      </div>`;
    }
    el.innerHTML = html;
  }catch(e){
    el.innerHTML = '<p class="sub">通信エラーが発生しました。</p>';
  }
}

function toggleDeleted(){ showDeleted=!showDeleted; renderAdminList(); }

async function useOne(docId,used,total){
  if(used>=total) return;
  await db.collection(COL_TICKETS).doc(docId).update({used:used+1});
  renderAdminList();
}
async function undoOne(docId,used){
  if(used<=0) return;
  await db.collection(COL_TICKETS).doc(docId).update({used:used-1});
  renderAdminList();
}
async function deleteTicket(docId){
  if(!confirm('この回数券を削除しますか？\n削除記録が残ります。')) return;
  await db.collection(COL_TICKETS).doc(docId).update({
    deleted:'deleted',
    deletedAt:toJSTString(new Date())
  });
  renderAdminList();
}

// ===== 利用者ログイン =====
async function loginUser(){
  const facilityCode = document.getElementById('login-facility-code').value.trim().toLowerCase();
  const name         = document.getElementById('login-name').value.trim();
  const id           = document.getElementById('login-id').value.trim();
  const errEl        = document.getElementById('login-err');
  if(!facilityCode){ errEl.textContent='施設コードを入力してください'; return; }
  if(!name){ errEl.textContent='お名前を入力してください'; return; }
  if(!id){ errEl.textContent='会員番号を入力してください'; return; }
  const el = document.getElementById('user-cards');
  showScreen('s-user');
  el.innerHTML = loadingHTML();
  document.getElementById('user-member-block').innerHTML = '';
  try{
    // 施設コードから管理者を特定
    const adminSnap = await db.collection(COL_ADMINS)
      .where('facilityCode','==',facilityCode).get();
    if(adminSnap.empty){
      showScreen('s-user-login');
      errEl.textContent = '施設コードが正しくありません';
      return;
    }
    const adminId  = adminSnap.docs[0].id;
    const facility = adminSnap.docs[0].data().facility || 'Lesson Pass Lite';

    // 会員番号＋adminIdで絞り込み
    const snap = await db.collection(COL_TICKETS)
      .where('member','==',padMember(id))
      .where('adminId','==',adminId)
      .get();
    const all     = snap.docs.map(d=>({docId:d.id,...d.data()}));
    const tickets = all.filter(t=>!isDeleted(t));
    const matched = tickets.filter(t=>t.name === name);

    if(!matched.length){
      showScreen('s-user-login');
      errEl.textContent = '施設コード・お名前・会員番号が正しくありません';
      return;
    }

    document.getElementById('user-facility-name').textContent = facility;
    const userName = matched[0].name;
    document.getElementById('user-member-block').innerHTML = `
      <div class="member-block">
        <div class="member-icon">${initials(userName)}</div>
        <div>
          <div class="member-name">${userName}</div>
          <div class="member-no">会員番号：${padMember(id)}</div>
        </div>
      </div>`;
    renderUserCards(matched);
  }catch(e){
    el.innerHTML = '<p class="sub">通信エラーが発生しました。再度お試しください。</p>';
  }
}

function renderUserCards(tickets){
  const el = document.getElementById('user-cards');
  el.innerHTML = tickets.map(t=>{
    const st     = statusOf(t);
    const remain = Number(t.total)-Number(t.used);
    const dl     = daysLeft(t.expiry);
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:500">${t.total}回券</span>${badgeHTML(st)}
      </div>
      ${renderDots(t.total,t.used,st)}
      <div class="sub mt8">残り <strong style="color:#1a1a1a;font-size:16px">${remain}</strong> 回</div>
      <div class="sub">有効期限：${dateOnly(t.expiry)}${st==='active'?` （あと${dl}日）`:''}</div>
    </div>`;
  }).join('');
}

// ===== Firestore ヘルパー =====
async function getTicketsByAdmin(adminId){
  const snap = await db.collection(COL_TICKETS)
    .where('adminId','==',adminId)
    .orderBy('issued','desc')
    .get();
  return snap.docs.map(d=>({docId:d.id,...d.data()}));
}

async function getNextMember(){
  // 施設ごとの連番
  const snap = await db.collection(COL_TICKETS)
    .where('adminId','==',currentAdminUid)
    .get();
  let max = 0;
  snap.docs.forEach(d=>{
    const m = parseInt(d.data().member);
    if(!isNaN(m)&&m>max) max=m;
  });
  return String(max+1).padStart(4,'0');
}

function showModal(title, body, copyText, onClose){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent  = body;
  const copyArea = document.getElementById('modal-copy-area');
  const copyBtn  = document.getElementById('modal-copy-btn');
  if(copyText){
    copyArea.value         = copyText;
    copyArea.style.display = 'block';
    copyBtn.style.display  = 'flex';
    copyBtn.innerHTML      = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> コピーする`;
    copyBtn.style.color       = '#1D9E75';
    copyBtn.style.borderColor = '#1D9E75';

  }

}
let modalOnClose = null;
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('active');
  if(modalOnClose){ modalOnClose(); modalOnClose=null; }
}
async function copyModalText(){
  const area = document.getElementById('modal-copy-area');
  area.select();
  area.setSelectionRange(0, 99999);
  try{

  }catch(e){

  }
  const btn = document.getElementById('modal-copy-btn');
  btn.innerHTML     = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> コピーしました`;
  btn.style.color       = '#0F6E56';
  btn.style.borderColor = '#0F6E56';
  setTimeout(()=>{
    btn.innerHTML         = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> コピーする`;
    btn.style.color       = '#1D9E75';
    btn.style.borderColor = '#1D9E75';

}
function downloadCsv(headers, rows, prefix){
  const csv = [headers, ...rows]
    .map(r => r.map(v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(','))
    .join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const now  = new Date();
  a.href     = url;
  a.download = `lp-${prefix}-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
function togglePw(inputId, btn){
  const input = document.getElementById(inputId);
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  btn.innerHTML = show ? svgEyeOff() : svgEye();
}

function dateOnly(str){ if(!str) return ''; return String(str).slice(0,10).replace(/-/g,'/'); }
function dateTime(str){ return str ? String(str).slice(0,16) : ''; }
function daysLeft(str){
  if(!str) return 0;
  const s = String(str).replace(' ','T');
  const d = new Date(s.includes('+') ? s : s+'+09:00');
  return Math.ceil((d-new Date())/(1000*60*60*24));
}
function isExpired(str){ return daysLeft(str)<=0; }
function isDeleted(t){ return t.deleted==='deleted'; }
function statusOf(t){
  if(isDeleted(t)) return 'deleted';
  if(isExpired(t.expiry)) return 'expired';
  if(Number(t.used)>=Number(t.total)) return 'used';
  return 'active';
}
function badgeHTML(st){
  if(st==='active')  return '<span class="badge badge-active">有効</span>';
  if(st==='expired') return '<span class="badge badge-expired">期限切れ</span>';
  if(st==='deleted') return '<span class="badge badge-deleted">削除済み</span>';
  return '<span class="badge badge-used">使い切り</span>';
}
function renderDots(total,used,status){
  const max = Math.min(Number(total),50); // 50超は丸非表示
  if(Number(total)>50) return `<div class="sub" style="margin:8px 0">（${total}回券）</div>`;
  let html = '<div class="dot-row">';
  for(let i=0;i<max;i++){
    if(i<Number(used))         html+='<div class="dot used">✓</div>';
    else if(status==='active') html+=`<div class="dot remaining">${i+1}</div>`;
    else                       html+=`<div class="dot">${i+1}</div>`;
  }
  return html+'</div>';
}
function loadingHTML(){ return '<div class="loading"><span class="spinner"></span>読み込み中...</div>'; }
function initials(name){
  const p = name.trim().split(/\s+/);
  return p.length>=2 ? p[0][0]+p[1][0] : name.slice(0,2);
}
function padMember(id){ return String(id).padStart(4,'0'); }
function toJSTString(date){
  const jst = new Date(date.getTime()+9*60*60*1000);
  return jst.toISOString().replace('T',' ').slice(0,16);
}
